version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: projects-postgres
    environment:
      POSTGRES_DB: project-manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - projects

volumes:
  postgres_data:

networks:
  projects:
    driver: bridge
