spring:
  datasource:
    url: jdbc:postgresql://${DB_CONNECTION:localhost:5432/project-manager}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  jpa:
    hibernate:
      ddl-auto:  validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
